# Website-only origin configuration. Keep other VPS virtual hosts unchanged.
# Preserve upstream policies by default. Bound public HTML freshness and keep
# the client-side inquiry workflow private; retain existing image/JS/CSS policies.
map $uri $zamique_cache_group {
    default "";
    /inquiry private;
    / html;
    /catalog html;
    /about html;
    /contact html;
    /custom-orders html;
    /faq html;
    /guides html;
    /buying-guide html;
    /terms html;
    /privacy html;
    "~^/(products|markets|wholesale|guides)/" html;
    /robots.txt discovery;
    /sitemap.xml discovery;
    /llms.txt discovery;
    /llms-full.txt discovery;
    /manifest.webmanifest discovery;
}

# A 304 response has no Content-Type. Classify known routes by URI so that
# conditional revalidation retains the same bounded policy as its 200 response.
map "$zamique_cache_group|$upstream_http_cache_control" $zamique_response_cache_control {
    default $upstream_http_cache_control;
    "~^private[|]" "private, no-store, max-age=0";
    "~*^html[|](?:public,\\s*)?s-maxage=31536000(?:,\\s*stale-while-revalidate=[0-9]+)?$" "public, max-age=0, s-maxage=600, stale-while-revalidate=60";
    "~*^html[|]s-maxage=60,\\s*stale-while-revalidate=31535940$" "public, max-age=0, s-maxage=60, stale-while-revalidate=300";
    "~*^discovery[|](?:public,\\s*)?s-maxage=31536000(?:,\\s*stale-while-revalidate=[0-9]+)?$" "public, max-age=0, s-maxage=300, stale-while-revalidate=60";
}

server {
    listen 2054 ssl;
    listen [::]:2054 ssl;
    server_name zamique.com www.zamique.com;

    ssl_certificate /etc/nginx/ssl/zamique.crt;
    ssl_certificate_key /etc/nginx/ssl/zamique.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cloudflare forwards HTTP to this same origin port. Upgrade instead of 400.
    error_page 497 =308 https://zamique.com$request_uri;
    if ($host = www.zamique.com) {
        return 308 https://zamique.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # IndexNow ownership proof persists across website releases. The key is
    # generated on the VPS, never included in source or the sitemap.
    location = /indexnow-key.txt {
        alias /var/www/zamique-indexnow/indexnow-key.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://cloudflareinsights.com; frame-src https://www.google.com https://maps.google.com; upgrade-insecure-requests" always;
    }

    # Bing ownership verification is kept outside the versioned application.
    location = /BingSiteAuth.xml {
        alias /var/www/zamique-verification/BingSiteAuth.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://cloudflareinsights.com; frame-src https://www.google.com https://maps.google.com; upgrade-insecure-requests" always;
    }

    # Only content-addressed generated photos get immutable caching. Original
    # uploads keep their existing policy; unavailable variants return real 404.
    location ^~ /images/optimized/ {
        root /var/www/zamique-image-assets;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://cloudflareinsights.com; frame-src https://www.google.com https://maps.google.com; upgrade-insecure-requests" always;
    }

    location / {
        proxy_hide_header Cache-Control;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Cache-Control $zamique_response_cache_control always;
        # add_header at this level overrides inherited security headers.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://www.google-analytics.com; font-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://analytics.google.com https://cloudflareinsights.com; frame-src https://www.google.com https://maps.google.com; upgrade-insecure-requests" always;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }
}
